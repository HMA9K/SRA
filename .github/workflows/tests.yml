# Projecttests en browsercontroles op iedere pull request en na samenvoegen in main.
# Draait zonder padfilters: de verplichte controles in de regel voor main ontbreken dus nooit.
# De bron-PDF's staan buiten Git; brongebonden controles draaien lokaal met `npm run test:sources`.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  SRA_WITHOUT_SOURCES: '1'

jobs:
  projecttests:
    name: Projecttests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - name: Leerdata, labs, rekenfuncties en bediening
        run: npm test
      - name: Leerstof
        run: npm run test:learning
      - name: Tentamenpunten
        run: npm run test:points
      - name: Vraagpatronen en uitleg
        run: npm run test:patterns
      - name: Antwoordmodelcontrole
        run: npm run test:audit
      - name: Tentamenfrequenties
        run: npm run test:frequencies
      - name: Donkere weergave
        run: python tests/dark-styles.py

  browsertests:
    name: Browsertests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEARNING_URL: http://127.0.0.1:8769/
      TEST_BASE_URL: http://127.0.0.1:8769
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Playwright met Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Lokale server
        run: |
          nohup python -m http.server 8769 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8769/index.html > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      # De tests doorlopen zelf desktop- en mobiele schermbreedtes (tot 320 px) en licht/donker.
      - name: Lessen, leerblokken, Leren en tentamenoefening
        run: |
          status=0
          for t in learning-revision learning-transitions compact-learning lesson-mini-graphs lesson-status \
                   lab-choices lab-sliders curriculum-labels exam-focus anova-reading lesson-panel \
                   learning-layout parked-controls exam-practice lesson-preparation; do
            echo "::group::$t"
            node "tests/$t-browser.cjs" || { echo "::error::Browsertest $t faalt"; status=1; }
            echo "::endgroup::"
          done
          exit $status
