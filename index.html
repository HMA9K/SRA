<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#444159">
  <meta name="description" content="Leer Sampling & Regression Analysis vanaf de basis, met interactieve uitleg, berekeningen en routes naar de tentamens.">
  <title>SRA · Begrijpen, oefenen, toepassen</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="vendor/study-ui/tokens.css">
  <link rel="stylesheet" href="vendor/study-ui/shell.css">
  <link rel="stylesheet" href="css/sra-layout.css">
  <link rel="stylesheet" href="css/presentation.css">
  <link rel="stylesheet" href="css/labs.css">
  <script defer src="data/course.js"></script>
  <script defer src="js/math.js"></script>
  <script defer src="js/labs.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body class="study-shell">
  <a class="skip" href="#main">Direct naar de inhoud</a>
  <header class="topbar study-topbar">
    <a class="brand study-brand" href="#home" aria-label="SRA hoofdpagina">SRA <span class="brand-sub">LEER- EN OEFENOMGEVING</span></a>
    <div class="top-tools study-controls">
      <button id="calc-open" aria-label="Rekenmachine openen" title="Rekenmachine"><svg class="calc-icon" aria-hidden="true" viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="1" width="14" height="21" rx="1"/><path d="M6 5h8v4H6zM6 12h2m2 0h2m2 0h1M6 15h2m2 0h2m2 0h1M6 18h2m2 0h2m2 0h1"/></svg></button>
      <div class="study-font-group" role="group" aria-label="Tekstgrootte">
        <button id="font-minus" title="Kleinere letters" aria-label="Kleinere letters">A−</button>
        <button id="font-reset" title="Standaardletters" aria-label="Standaardletters" hidden>A</button>
        <button id="font-plus" title="Grotere letters" aria-label="Grotere letters">A+</button>
      </div>
      <span class="study-profile"><svg aria-hidden="true" viewBox="0 0 40 40" fill="currentColor"><path fill-rule="evenodd" d="M20 0a20 20 0 1 0 0 40 20 20 0 0 0 0-40Zm0 7a7 7 0 1 1 0 14 7 7 0 0 1 0-14ZM7 32c1-6 6-9 13-9s12 3 13 9a17 17 0 0 1-26 0Z"/></svg><span>Anoniem</span></span>
    </div>
  </header>
  <nav class="topnav study-nav sra-navigation" aria-label="Hoofdnavigatie">
    <button id="menu-toggle" aria-label="Leerroute openen of sluiten" aria-expanded="false" aria-controls="sidebar" hidden>☰ <span>Leerroute</span></button>
    <div class="sra-primary-links">
      <a href="#home" data-nav="home">Home</a>
      <a href="#leren" data-nav="leren">Leren</a>
      <a href="#oefenen" data-nav="oefenen">Oefenvragen</a>
      <a href="#tentamen" data-nav="tentamen">Tentamens</a>
    </div>
    <details class="sra-tools-menu" id="tools-menu">
      <summary aria-label="Hulpmiddelen openen">Meer <span aria-hidden="true">⌄</span></summary>
      <div class="sra-tools-panel">
        <a href="#voortgang" data-nav="voortgang">Voortgang</a>
        <a href="#begrippen" data-nav="begrippen">Begrippen</a>
        <a href="#bronnen" data-nav="bronnen">Bronnen</a>
      </div>
    </details>
  </nav>
  <div class="layout">
    <aside id="sidebar" aria-label="Lessen"></aside>
    <main id="main" tabindex="-1"><noscript><h1>SRA-samenvatting</h1><p>Voor de interactieve lessen is JavaScript nodig. Je kunt de volledige uitleg en alle antwoorden ook lezen in de <a href="SRA leesversie.html">zelfstandige leesversie</a>.</p></noscript></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="question-overview" class="study-overview-dialog" aria-labelledby="question-overview-title">
    <form method="dialog" class="study-overview-head"><h2 id="question-overview-title">Vragenoverzicht</h2><button type="submit" aria-label="Vragenoverzicht sluiten">×</button></form>
    <div id="question-overview-content" class="study-overview-body"></div>
    <form method="dialog" class="study-overview-footer"><span id="question-overview-range" class="study-overview-range"></span><button type="submit" class="study-btn primary">Sluiten</button></form>
  </dialog>
  <dialog id="confirmation" aria-labelledby="confirm-title">
    <form method="dialog">
      <div class="dialog-head"><h2 id="confirm-title">Voortgang wijzigen</h2></div>
      <div class="calc-body"><p id="confirm-message"></p><div class="actions"><button class="btn" value="cancel" autofocus>Annuleren</button><button class="btn primary" value="confirm">Bevestigen</button></div></div>
    </form>
  </dialog>
  <dialog id="calculator" aria-labelledby="calc-title">
    <form method="dialog" class="dialog-head"><h2 id="calc-title">Rekenmachine</h2><button class="icon-button" aria-label="Rekenmachine sluiten">×</button></form>
    <div class="calc-body"><label for="calc-expression">Berekening</label><input id="calc-expression" inputmode="text" autocomplete="off" placeholder="Bijv. 3740 * (636 - 97185 / 165)"><output id="calc-result" aria-live="polite">0</output><div id="calc-keys" class="calc-keys"></div><p class="muted">Gebruik punt of komma voor decimalen, zonder duizendtallen. √, ln, exp en machten zijn beschikbaar.</p></div>
  </dialog>
</body>
</html>
